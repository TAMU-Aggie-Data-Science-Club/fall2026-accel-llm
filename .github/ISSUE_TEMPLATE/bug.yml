name: Bug
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      options: [Edge, Cloud, UI, Eval, Cross-team]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened vs. what you expected
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (env: local / HPRC)
    validations: {required: true}
